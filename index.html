<style>
/* Layout: one narrow column like a phone logbook (max 720px), fixed bottom tab bar, LED rest clock docks above it */
:root{
  --bg:#eceff2; --surface:#fafbfc; --surface-2:#e3e7ec; --ink:#15181d; --muted:#5b6471; --line:#d2d8df;
  --accent:#1747c4; --accent-ink:#ffffff; --accent-soft:#dce5fb;
  --good:#1c7a46; --good-ink:#ffffff; --good-soft:#d9efe2;
  --gold:#9a6200; --gold-soft:#f6e9c9;
  --danger:#c2262e; --danger-ink:#ffffff;
  --bar-past:#a9b9e6;
  --p25:#d22b2b; --p20:#1d54d4; --p15:#e9b90f; --p10:#1e8a4b; --p5:#f5f5f2; --p2:#2b2e34; --p1:#bcc2ca; --plate-edge:#15181d40;
  --bar:#8b939d; --bar-hi:#c9ced5;
  --clock-bg:#0d0e10; --clock-ink:#f2f2f2; --clock-dim:#ffffff8c; --clock-btn:#ffffff17; --clock-btn-hi:#ffffff29;
  --led-on:#ff3b2f; --led-off:#ff3b2f17; --led-glow:#ff3b2f70;
  --scrim:#0b0d1199; --pop:0 10px 30px #0b0d1140;
  --f-display:"Sofia Sans Extra Condensed","Avenir Next Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-num:"Sofia Sans Condensed","Avenir Next Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --surface:#171b21; --surface-2:#212730; --ink:#e7eaee; --muted:#97a1ad; --line:#2b323c;
    --accent:#6a95ff; --accent-ink:#0a1230; --accent-soft:#1c2a4d;
    --good:#48c07b; --good-ink:#06150c; --good-soft:#15301f;
    --gold:#f0b545; --gold-soft:#3a2d10;
    --danger:#ff6168; --danger-ink:#1d0405;
    --bar-past:#2f4677;
    --p5:#e9e9e4; --p2:#0a0b0d; --plate-edge:#00000080; --bar:#7d858f; --bar-hi:#a9b0b9;
    --scrim:#000000b3; --pop:0 10px 30px #00000080;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#212730; --ink:#e7eaee; --muted:#97a1ad; --line:#2b323c;
  --accent:#6a95ff; --accent-ink:#0a1230; --accent-soft:#1c2a4d;
  --good:#48c07b; --good-ink:#06150c; --good-soft:#15301f;
  --gold:#f0b545; --gold-soft:#3a2d10;
  --danger:#ff6168; --danger-ink:#1d0405;
  --bar-past:#2f4677;
  --p5:#e9e9e4; --p2:#0a0b0d; --plate-edge:#00000080; --bar:#7d858f; --bar-hi:#a9b0b9;
  --scrim:#000000b3; --pop:0 10px 30px #00000080;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
body.has-clock{ padding-bottom:calc(176px + env(safe-area-inset-bottom,0px)); }
.wrap{ max-width:720px; margin:0 auto; }
button{ font:inherit; color:inherit; }
input,select{ font:inherit; }

.sync{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.sync i{ width:7px; height:7px; border-radius:50%; background:var(--muted); }
.sync[data-s="saved"] i{ background:var(--good); }
.sync[data-s="saving"] i, .sync[data-s="local"] i{ background:var(--gold); }
.sync[data-s="error"] i, .sync[data-s="memory"] i{ background:var(--danger); }

/* type */
.page-head{ display:grid; gap:4px; padding-block:18px 10px; }
.eyebrow{ margin:0; font-size:12px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
h1{ margin:0; font-family:var(--f-display); font-weight:800; font-size:clamp(42px, 11vw, 62px); line-height:.9; text-transform:uppercase; text-wrap:balance; }
h2{ margin:0; font-family:var(--f-display); font-weight:700; font-size:23px; line-height:1; letter-spacing:.03em; text-transform:uppercase; text-wrap:balance; }
h3{ margin:0; font-family:var(--f-num); font-weight:700; font-size:19px; line-height:1.15; }
.hint{ margin:0; font-size:13px; color:var(--muted); max-width:62ch; }
.block{ display:grid; gap:14px; padding-block:20px; border-top:1px solid var(--line); }
.block-head{ display:grid; gap:5px; }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:0 16px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; }
.btn:hover{ border-color:var(--muted); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ border-color:var(--accent); filter:brightness(1.08); }
.btn-danger{ background:var(--danger); border-color:var(--danger); color:var(--danger-ink); }
.btn-ghost{ background:transparent; border-style:dashed; border-width:1.5px; }
.btn-text{ background:none; border-color:transparent; color:var(--accent); padding:0 8px; }
.btn-text:hover{ border-color:transparent; text-decoration:underline; }
.btn-small{ min-height:36px; padding:0 12px; font-size:13px; }
.danger{ color:var(--danger); }
.wide{ width:100%; }
.big{ min-height:54px; font-size:16px; }
.row-btns{ display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; }
.icon-btn{ all:unset; cursor:pointer; width:40px; height:40px; display:grid; place-items:center; border-radius:8px; color:var(--muted); font-size:18px; }
.icon-btn:hover{ background:var(--surface-2); color:var(--ink); }

/* programs */
.prog-grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
@media (min-width:660px){
  .prog-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .prog-grid > .prog:last-child:nth-child(odd){ grid-column:1 / -1; }
}
.prog{ display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.prog-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.prog h3{ font-family:var(--f-display); font-weight:800; font-size:32px; line-height:.9; text-transform:uppercase; min-width:0; overflow-wrap:anywhere; }
.prog-list{ margin:0; padding:0; list-style:none; display:grid; gap:5px; font-size:14px; align-content:start; }
.prog-list li{ display:grid; grid-template-columns:56px minmax(0,1fr); gap:8px; align-items:baseline; }
.sr{ font-family:var(--f-num); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; color:var(--accent); }
.prog-actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:auto; }
.prog-actions .btn-primary{ flex:1 1 160px; }
.prog-last{ margin:0; padding-top:10px; border-top:1px dashed var(--line); font-size:13px; color:var(--muted); }
.prog-last b{ color:var(--ink); font-weight:600; }
.chip{ font-size:12px; padding:2px 9px; border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
.last-card{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.last-card b{ font-weight:600; font-size:16px; }

/* active workout */
.wo-name{ width:100%; padding:0; border:0; border-bottom:2px dashed transparent; background:transparent; color:var(--ink); font-family:var(--f-display); font-weight:800; font-size:clamp(38px, 10vw, 56px); line-height:1; text-transform:uppercase; }
.wo-name:hover{ border-bottom-color:var(--line); }
.stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); margin:10px 0 0; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
.stats > div{ min-width:0; padding:10px 14px; border-left:1px solid var(--line); }
.stats > div:first-child{ border-left:0; }
.stats dt{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.stats dd{ margin:0; font-family:var(--f-num); font-weight:700; font-size:26px; line-height:1.1; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.stats small{ font-size:15px; font-weight:500; color:var(--muted); }
.stats.four{ grid-template-columns:repeat(4, minmax(0,1fr)); }
@media (max-width:560px){
  .stats.four{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .stats.four > div:nth-child(3){ border-left:0; }
  .stats.four > div:nth-child(n+3){ border-top:1px solid var(--line); }
}

.ex-list{ display:grid; gap:12px; padding-block:14px; }
.ex{ display:grid; gap:12px; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); scroll-margin-top:16px; }
.ex-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.ex-top{ display:grid; gap:3px; min-width:0; }
.ex-move{ display:flex; gap:4px; flex:none; }
.ex-move button{ all:unset; box-sizing:border-box; cursor:pointer; width:40px; height:40px; display:grid; place-items:center; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); }
.ex-move button:hover:not(:disabled){ color:var(--accent); border-color:var(--accent); }
.ex-move button:disabled{ opacity:.3; cursor:default; }
.ex-move svg{ width:18px; height:18px; }
.ex.moved{ animation:moved .7s ease-out; }
@keyframes moved{ from{ box-shadow:0 0 0 3px var(--accent); } to{ box-shadow:0 0 0 3px transparent; } }
.ex-meta{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.prev{ margin:0; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.sets{ display:grid; gap:4px; }
.set, .set-head{ display:grid; grid-template-columns:30px minmax(0,1fr) 14px minmax(0,1fr) 50px; gap:8px; align-items:center; }
.set-head{ padding:0 4px; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.set-head span{ text-align:center; }
.set{ padding:4px; border-radius:10px; transition:background-color .15s; }
.set-n{ text-align:center; font-family:var(--f-num); font-weight:700; font-size:17px; color:var(--muted); }
.set-in{ width:100%; min-width:0; height:48px; padding:0 6px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-family:var(--f-num); font-weight:700; font-size:23px; text-align:center; font-variant-numeric:tabular-nums; }
.set-in::placeholder{ color:var(--muted); opacity:.6; font-weight:600; }
.set-x{ text-align:center; color:var(--muted); }
.tick{ width:50px; height:48px; display:grid; place-items:center; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; }
.tick svg{ width:22px; height:22px; }
.tick:hover{ border-color:var(--good); color:var(--good); }
.set.is-done{ background:var(--good-soft); }
.set.is-done .set-in{ border-color:transparent; background:transparent; }
.set.is-done .tick{ background:var(--good); border-color:var(--good); color:var(--good-ink); }
.set.is-pr{ background:var(--gold-soft); }
.set.is-pr .set-n{ color:var(--gold); }
.set.shake{ animation:shake .3s; }
@keyframes shake{ 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.ex-foot{ display:flex; flex-wrap:wrap; gap:8px; }
.ex-foot .push{ margin-left:auto; }
.plates-inline{ padding-top:12px; border-top:1px dashed var(--line); }

/* barbell */
.barbell{ margin:0; display:grid; gap:8px; justify-items:center; }
.bb-svg{ display:block; width:100%; max-width:440px; height:auto; }
.barbell figcaption{ font-size:14px; text-align:center; display:grid; gap:4px; }
.barbell figcaption b{ font-family:var(--f-num); font-size:18px; font-variant-numeric:tabular-nums; }
.warn{ color:var(--gold); font-size:13px; }

/* history */
.month{ display:grid; gap:8px; padding-block:16px 4px; }
.month-h span{ font-family:var(--f-body); font-size:13px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--muted); }
.hist{ margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
.h-item{ border-bottom:1px solid var(--line); }
.h-row{ all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 4px; border-radius:8px; }
.h-row:hover{ background:var(--surface); }
.h-date{ display:grid; justify-items:center; line-height:1; }
.h-date b{ font-family:var(--f-display); font-weight:800; font-size:32px; }
.h-date small{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.h-main{ display:grid; gap:2px; min-width:0; }
.h-name{ display:flex; align-items:center; gap:8px; min-width:0; font-weight:600; font-size:16px; }
.h-name .t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.h-sub{ font-size:13px; color:var(--muted); }
.h-vol{ text-align:right; font-family:var(--f-num); font-variant-numeric:tabular-nums; }
.h-vol b{ display:block; font-size:21px; font-weight:700; line-height:1; }
.h-vol small{ font-size:12px; color:var(--muted); }
.h-detail{ display:grid; gap:14px; padding:2px 4px 16px 62px; }
.h-ex{ margin:0; padding:0; list-style:none; display:grid; gap:12px; }
.h-ex li{ display:grid; gap:2px; }
.h-ex-n{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-weight:600; }
.h-sets{ font-family:var(--f-num); font-weight:600; font-size:17px; font-variant-numeric:tabular-nums; }
.h-sets i{ font-style:normal; color:var(--muted); padding:0 6px; }
.h-e1{ font-size:12px; color:var(--muted); }
.pr-chip{ font-size:11px; font-weight:600; letter-spacing:.02em; padding:2px 8px; border-radius:999px; background:var(--gold-soft); color:var(--gold); white-space:nowrap; }

/* progress */
.chart{ width:100%; min-width:0; }
.chart svg{ display:block; width:100%; height:auto; overflow:visible; }
.chart text{ font-family:var(--f-num); font-size:12px; fill:var(--muted); font-variant-numeric:tabular-nums; }
.chart .lbl-strong{ fill:var(--ink); font-weight:700; font-size:14px; }
.pr-grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:0; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
.pr-grid > div{ display:grid; gap:2px; align-content:start; min-width:0; padding:10px 14px; border-left:1px solid var(--line); }
.pr-grid > div:first-child{ border-left:0; }
.pr-grid span{ font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.pr-grid b{ font-family:var(--f-num); font-weight:700; font-size:26px; line-height:1.05; font-variant-numeric:tabular-nums; }
.pr-grid small{ font-size:12px; color:var(--muted); }
@media (max-width:560px){
  .pr-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .pr-grid > div:nth-child(3){ border-left:0; }
  .pr-grid > div:nth-child(n+3){ border-top:1px solid var(--line); }
}
.field, select.field{ width:100%; height:46px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); }
.field.num{ width:130px; font-family:var(--f-num); font-weight:700; font-size:22px; text-align:center; font-variant-numeric:tabular-nums; }

/* tools */
.tool-row{ display:flex; flex-wrap:wrap; gap:14px 24px; align-items:end; }
.fld{ display:grid; gap:6px; }
.fld > label, .fld > span{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.stepper{ display:flex; align-items:stretch; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.stepper button{ all:unset; cursor:pointer; width:50px; display:grid; place-items:center; font-size:24px; font-weight:600; color:var(--accent); }
.stepper button:hover{ background:var(--surface-2); }
.stepper input{ width:112px; height:54px; border:0; border-inline:1px solid var(--line); background:var(--bg); color:var(--ink); text-align:center; font-family:var(--f-num); font-weight:700; font-size:30px; font-variant-numeric:tabular-nums; }
.seg{ display:inline-flex; flex-wrap:wrap; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.seg button{ all:unset; cursor:pointer; height:46px; min-width:48px; padding:0 12px; box-sizing:border-box; display:grid; place-items:center; border-left:1px solid var(--line); font-family:var(--f-num); font-weight:700; font-size:18px; font-variant-numeric:tabular-nums; }
.seg button:first-child{ border-left:0; }
.seg button:hover{ background:var(--surface-2); }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.plate-out{ padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.plate-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.pchip{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:5px 12px 5px 6px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-family:var(--f-num); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
.pchip i{ width:20px; height:20px; border-radius:50%; border:1px solid var(--plate-edge); }
.pchip[aria-pressed="false"]{ opacity:.5; text-decoration:line-through; }
.rm-big{ display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
.rm-big b{ font-family:var(--f-display); font-weight:800; font-size:68px; line-height:.85; font-variant-numeric:tabular-nums; }
.rm-big span{ color:var(--muted); }
.tbl-wrap{ overflow-x:auto; }
.pct{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.pct th, .pct td{ padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); }
.pct th:first-child, .pct td:first-child{ text-align:left; }
.pct th{ font-size:11px; font-weight:500; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.pct td{ font-family:var(--f-num); font-weight:600; font-size:17px; }
.set-line{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
.switch{ all:unset; cursor:pointer; flex:none; position:relative; width:50px; height:30px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); }
.switch span{ position:absolute; top:4px; left:4px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:transform .15s; }
.switch[aria-checked="true"]{ background:var(--accent); border-color:var(--accent); }
.switch[aria-checked="true"] span{ transform:translateX(20px); background:var(--accent-ink); }

/* empty */
.empty{ display:grid; gap:10px; justify-items:start; padding:24px 20px; border:1.5px dashed var(--line); border-radius:12px; }
.empty p{ margin:0; color:var(--muted); max-width:52ch; }

/* rest clock */
.clock{ position:fixed; left:0; right:0; bottom:calc(65px + env(safe-area-inset-bottom,0px)); z-index:20; pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:0 10px; }
.clock-inner{ pointer-events:auto; position:relative; overflow:hidden; max-width:720px; margin:0 auto; display:flex; align-items:center; gap:12px; padding:10px 12px 12px 16px; border-radius:14px; border:1px solid var(--line); background:var(--clock-bg); color:var(--clock-ink); box-shadow:var(--pop); }
.clock-l{ display:grid; gap:2px; }
.clock-lbl{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--clock-dim); }
.clock-digits svg{ display:block; height:44px; width:auto; filter:drop-shadow(0 0 6px var(--led-glow)); }
.clock-digits .on{ fill:var(--led-on); }
.clock-digits .off{ fill:var(--led-off); }
.clock-btns{ margin-left:auto; display:flex; gap:6px; }
.clock-btns button{ all:unset; cursor:pointer; height:42px; padding:0 12px; border-radius:8px; background:var(--clock-btn); color:var(--clock-ink); font-family:var(--f-num); font-weight:700; font-size:15px; }
.clock-btns button:hover{ background:var(--clock-btn-hi); }
.clock-track{ position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--clock-btn); }
.clock-track i{ display:block; height:100%; width:0; background:var(--led-on); }
.clock.is-over .clock-digits{ animation:blink 1s steps(2, jump-none) infinite; }
@keyframes blink{ 50%{ opacity:.25 } }
@media (max-width:420px){ .clock-btns button{ padding:0 9px; } .clock-digits svg{ height:38px; } }

/* bottom nav */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:30; border-top:1px solid var(--line); background:var(--surface);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-bottom:env(safe-area-inset-bottom,0px); }
.nav-in{ max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); }
.nav button{ all:unset; cursor:pointer; position:relative; min-width:0; height:64px; display:grid; justify-items:center; align-content:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--muted); white-space:nowrap; }
.nav button svg{ width:24px; height:24px; }
.nav button[aria-current="page"]{ color:var(--accent); }
.nav button[aria-current="page"]::before{ content:""; position:absolute; top:-1px; left:30%; right:30%; height:3px; border-radius:0 0 3px 3px; background:var(--accent); }
.nav button[data-live]::after{ content:""; position:absolute; top:12px; left:calc(50% + 10px); width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 2px var(--surface); }

/* toast */
.toast{ position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom,0px)); z-index:40; transform:translate(-50%, 8px); max-width:min(92vw, 520px); padding:11px 16px; border-radius:10px; background:var(--ink); color:var(--bg); font-size:14px; font-weight:500; box-shadow:var(--pop); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
.toast.show{ opacity:1; transform:translate(-50%, 0); }
body.has-clock .toast{ bottom:calc(166px + env(safe-area-inset-bottom,0px)); }

/* sheet */
.sheet-wrap{ position:fixed; inset:0; z-index:50; display:grid; align-items:end; justify-items:center; }
.sheet-bg{ position:absolute; inset:0; background:var(--scrim); }
.sheet{ position:relative; width:100%; max-width:560px; max-height:min(86vh, 760px); overflow:auto; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-content:start; border-radius:16px 16px 0 0; background:var(--surface); box-shadow:var(--pop);
  padding:18px max(18px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px)); }
@media (min-width:640px){ .sheet-wrap{ align-items:center; } .sheet{ border-radius:16px; } }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.sheet-btns{ display:grid; gap:8px; }
.chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chip-btn{ all:unset; cursor:pointer; padding:8px 13px; border-radius:999px; border:1px solid var(--line); font-size:13px; font-weight:600; white-space:nowrap; }
.chip-btn[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
.lib-list{ margin:0; padding:0; list-style:none; display:grid; }
.lib-list button{ all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; padding:11px 6px; border-bottom:1px solid var(--line); }
.lib-list button:hover{ background:var(--surface-2); }
.lib-n{ font-weight:600; }
.lib-g{ grid-column:1; font-size:12px; color:var(--muted); }
.lib-list .chip{ grid-column:2; grid-row:1 / 3; align-self:center; }
.lib-add{ color:var(--accent); }
.chips.wrap{ flex-wrap:wrap; overflow:visible; }
.opts{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
@media (max-width:420px){ .opts{ grid-template-columns:minmax(0,1fr); } }
.opt{ all:unset; box-sizing:border-box; cursor:pointer; display:grid; gap:2px; align-content:start; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); }
.opt span{ font-size:12px; color:var(--muted); }
.opt:hover{ border-color:var(--muted); }
.opt[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
.my-ex{ margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
.my-ex li{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 2px; border-bottom:1px solid var(--line); }
.my-ex li > div{ display:grid; gap:1px; min-width:0; }
.my-ex b{ font-weight:600; overflow-wrap:anywhere; }

/* calories */
.cal{ display:grid; gap:14px; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.cal-day{ display:flex; align-items:center; gap:2px; }
.cal-day button{ all:unset; cursor:pointer; width:36px; height:36px; display:grid; place-items:center; border-radius:8px; color:var(--muted); font-size:20px; line-height:1; }
.cal-day button:hover:not(:disabled){ background:var(--surface-2); color:var(--ink); }
.cal-day button:disabled{ opacity:.3; cursor:default; }
.cal-day .lbl{ font-size:14px; font-weight:600; padding:0 4px; white-space:nowrap; }
.cal-nums{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); margin:0; }
.cal-nums > div{ display:grid; gap:1px; align-content:start; min-width:0; padding:0 10px; border-left:1px solid var(--line); }
.cal-nums > div:first-child{ padding-left:0; border-left:0; }
.cal-nums dt{ font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.cal-nums dd{ margin:0; font-family:var(--f-num); font-weight:700; font-size:28px; line-height:1.05; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.cal-nums dd.sub{ font-family:var(--f-body); font-size:12px; font-weight:500; line-height:1.3; color:var(--muted); }
.cal-in{ color:var(--accent); }
.cal-out{ color:var(--gold); }
.cal-ok{ color:var(--good); }
.cal-bad{ color:var(--danger); }
.cal-goal{ display:grid; gap:6px; }
.cal-goal p{ margin:0; font-size:13px; color:var(--muted); }
.cal-goal p b{ color:var(--ink); font-weight:600; }
.cal-track{ position:relative; height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
.cal-track i{ position:absolute; top:0; bottom:0; left:0; border-radius:5px; background:var(--accent); }
.cal-track i.over{ background:var(--danger); }
.cal-btns{ display:flex; flex-wrap:wrap; gap:8px; }
.cal-btns .btn{ flex:1 1 100px; }
.cal-week{ display:grid; gap:6px; }
.cal-week svg{ display:block; width:100%; height:auto; }
.cal-week text{ font-family:var(--f-num); font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
.cal-week text.cur{ fill:var(--ink); font-weight:700; }
.cal-week .hit{ fill:transparent; cursor:pointer; }
.cal-week .bar, .cal-week text{ pointer-events:none; }
.cal-week .hit:hover{ fill:var(--surface-2); fill-opacity:.6; }
.cal-legend{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--muted); }
.cal-legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.cal-setup{ display:grid; gap:8px; justify-items:start; padding:12px 14px; border-radius:10px; background:var(--accent-soft); }
.cal-setup p{ margin:0; font-size:14px; }
.cal-sec{ display:grid; gap:8px; }
.cal-sec-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.cal-sec-h h3{ font-family:var(--f-display); font-weight:800; font-size:22px; text-transform:uppercase; }
.cal-sec-h span{ font-family:var(--f-num); font-weight:700; font-size:18px; font-variant-numeric:tabular-nums; }
.cal-list{ margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
.cal-list li{ border-bottom:1px solid var(--line); }
.cal-row{ all:unset; box-sizing:border-box; width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:1px 12px; align-items:center; padding:9px 2px; }
button.cal-row{ cursor:pointer; }
button.cal-row:hover{ background:var(--surface-2); }
.cal-row .nm{ font-weight:600; overflow-wrap:anywhere; }
.cal-row .sb{ grid-column:1; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.cal-row .kv{ grid-column:2; grid-row:1 / span 2; font-family:var(--f-num); font-weight:700; font-size:18px; font-variant-numeric:tabular-nums; }
.cal-meal{ padding:8px 2px 2px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); }
.macro{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.macro b{ color:var(--ink); font-family:var(--f-num); font-size:16px; font-weight:700; }
.grid3{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.grid2{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.field.big-num{ height:56px; font-family:var(--f-num); font-weight:700; font-size:28px; font-variant-numeric:tabular-nums; }
.field.mid-num{ font-family:var(--f-num); font-weight:700; font-size:20px; text-align:center; font-variant-numeric:tabular-nums; }
.inline-save{ display:flex; gap:8px; align-items:stretch; }
.inline-save .field{ flex:1 1 0; width:0; min-width:0; }

/* backup */
.backup-box{ display:grid; gap:10px; padding:14px; border-radius:12px; border:1px solid var(--gold); background:var(--gold-soft); }
.backup-box p{ margin:0; }
.btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
.last-backup{ margin:0; font-size:14px; }
.transfer{ display:grid; gap:10px; justify-items:start; padding:16px; border-radius:12px; border:1.5px dashed var(--accent); background:var(--accent-soft); }

.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.block-head.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.seg.small button{ height:36px; font-family:var(--f-body); font-size:14px; font-weight:600; }
.b-row{ display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 4px; }
.b-main{ display:grid; gap:2px; min-width:0; }
.b-vals{ display:flex; flex-wrap:wrap; gap:2px 16px; align-items:baseline; font-size:14px; color:var(--muted); }
.b-vals b{ font-family:var(--f-num); font-size:23px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
.b-photos{ display:flex; gap:8px; overflow-x:auto; padding:0 4px 14px 62px; }
@media (max-width:480px){ .b-photos{ padding-left:4px; } }
.ph{ all:unset; box-sizing:border-box; cursor:pointer; position:relative; flex:none; width:86px; aspect-ratio:3/4; max-width:100%; border-radius:8px; overflow:hidden; background:var(--surface-2); }
.ph img, .ph-tile img{ display:block; width:100%; height:100%; object-fit:cover; }
.ph-stamp{ position:absolute; left:4px; bottom:4px; padding:1px 5px; border-radius:4px; background:var(--scrim); color:var(--clock-ink); font-family:var(--f-num); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
.form-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
.form-grid .fld-date{ grid-column:1 / -1; }
.form-grid .field.num{ width:100%; }
@media (min-width:520px){ .form-grid{ grid-template-columns:1.4fr 1fr 1fr; } .form-grid .fld-date{ grid-column:auto; } }
.ph-edit{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
.ph-tile{ position:relative; aspect-ratio:3/4; max-width:100%; border-radius:10px; overflow:hidden; background:var(--surface-2); display:grid; place-items:center; font-size:12px; color:var(--muted); text-align:center; }
.ph-tile button{ all:unset; cursor:pointer; position:absolute; top:4px; right:4px; width:30px; height:30px; display:grid; place-items:center; border-radius:50%; background:var(--scrim); color:var(--clock-ink); font-size:14px; }
.ph-add{ aspect-ratio:3/4; max-width:100%; display:grid; place-items:center; padding:6px; border:1.5px dashed var(--line); border-radius:10px; color:var(--accent); font-size:13px; font-weight:600; text-align:center; cursor:pointer; }
.ph-add:hover{ border-color:var(--accent); }
#bm-file:focus-visible + .ph-add{ outline:2px solid var(--accent); outline-offset:2px; }
.ph-view{ position:relative; margin:0; display:grid; place-items:center; border-radius:12px; overflow:hidden; background:var(--surface-2); min-height:200px; }
.ph-view img{ display:block; max-width:100%; max-height:62vh; object-fit:contain; }
.ph-view .ph-stamp{ left:10px; bottom:10px; padding:3px 8px; font-size:14px; }
.ph-cap{ margin:0; font-family:var(--f-num); font-weight:600; font-size:18px; font-variant-numeric:tabular-nums; }
.ph-nav{ display:flex; align-items:center; justify-content:center; gap:16px; font-variant-numeric:tabular-nums; }
.cmp{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.cmp figure{ margin:0; display:grid; gap:6px; align-content:start; min-width:0; }
.cmp .ph-frame{ position:relative; border-radius:10px; overflow:hidden; background:var(--surface-2); aspect-ratio:3/4; max-width:100%; }

.cmp figcaption span{ color:var(--muted); font-variant-numeric:tabular-nums; }

[data-act]:focus-visible, input:focus-visible, select:focus-visible, .h-row:focus-visible{ outline:2px solid var(--accent) !important; outline-offset:2px; }
@media (prefers-reduced-motion: reduce){

<script>
(function(){
'use strict';
document.documentElement.lang = 'ru';

/* ---------- reference data ---------- */
const LIB = [

/* items: [exercise, sets, reps] — for cardio: [exercise, sets, minutes] */

  {id:'shoulders-calves', name:'Плечи и голень', note:'Дельты со всех сторон и икроножные', items:[['ohp',4,8],['db-press',3,10],['lat-raise',4,15],['rear-raise',3,15],['calf',4,15],['calf-seated',4,20]]},
  {id:'arms', name:'Руки', note:'Бицепс, трицепс, предплечья', items:[['bb-curl',4,10],['cgbp',4,8],['hammer',3,12],['skull',3,10],['preacher',3,12],['pushdown',3,12]]},
  {id:'legs', name:'Ноги', note:'Квадрицепс, бицепс бедра, ягодицы', items:[['squat',4,6],['rdl',3,8],['leg-press',3,12],['lunge',3,10],['leg-curl',3,12],['leg-ext',3,12]]},

const PLATE_VAR = {25:'--p25',20:'--p20',15:'--p15',10:'--p10',5:'--p5',2.5:'--p2',1.25:'--p1'};
const DEF = {rest:90, sound:true, bar:20, plates:ALL_PLATES.slice(), custom:[]};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- state ---------- */
const S = {
  docs:{}, ver:0, loaded:false,
  active:null, activeAt:0,
  settings:clone(DEF),
  tab:'workout', openHist:null, platesOpen:new Set(),
  progEx:null, libGroup:'Все', libQ:'',
  tools:{target:100, w1:80, r1:5},

};
const h0 = (location.hash||'').slice(1);
if(['workout','history','progress','body','tools'].includes(h0)) S.tab = h0;
S.bodyMetric = 'weight'; S.bf = null; S.pv = null; S.restore = null; S.calDay = null; S.cf = null; S.ca = null; S.cp = null; S.cfRecent = [];

/* ---------- utils ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ if(v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; }
function fmtN(n){ if(n == null || !Number.isFinite(n)) return ''; return (Math.round(n*100)/100).toLocaleString('ru-RU', {maximumFractionDigits:2}); }
function fmtIn(n){ return n == null ? '' : String(n).replace('.', ','); }
function round1(n){ return Math.round(n*10)/10; }
function roundTo(n, s){ return Math.round(n/s)*s; }
function uid(){ return Math.random().toString(36).slice(2, 9); }
function e1rm(w, r){ w = +w || 0; r = +r || 0; if(!w || !r) return 0; return r === 1 ? w : w*(1 + r/30); }
function plural(n, f){ n = Math.abs(n) % 100; const d = n % 10; if(n > 10 && n < 20) return f[2]; if(d > 1 && d < 5) return f[1]; if(d === 1) return f[0]; return f[2]; }
function pad(n){ return String(n).padStart(2, '0'); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
const DF = o => new Intl.DateTimeFormat('ru-RU', o);
const fDayMonth = DF({day:'numeric', month:'short'});
const fWeekday = DF({weekday:'short'});
const fMonth = DF({month:'long'});
const fTime = DF({hour:'2-digit', minute:'2-digit'});
function shortDate(ts){ return fDayMonth.format(new Date(ts)).replace('.', ''); }
function dayStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d.getTime(); }
function ago(ts){
  const d = Math.round((dayStart(Date.now()) - dayStart(ts))/864e5);
  if(d <= 0) return 'сегодня';
  if(d === 1) return 'вчера';
  if(d < 7) return d + ' ' + plural(d, ['день','дня','дней']) + ' назад';
  if(d < 35){ const w = Math.floor(d/7); return w + ' ' + plural(w, ['неделю','недели','недель']) + ' назад'; }
  return shortDate(ts);
}
function clockStr(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60; return h ? h + ':' + pad(m) + ':' + pad(ss) : pad(m) + ':' + pad(ss); }
function dur(ms){ const m = Math.max(1, Math.round(ms/60000)); const h = Math.floor(m/60); return h ? h + ' ч ' + pad(m%60) + ' мин' : m + ' мин'; }
function setStr(s){
  if(s.t != null) return fmtN(s.t) + ' мин' + (s.d ? ', ' + fmtN(s.d) + ' км' : '');
  return s.w ? fmtN(s.w) + '×' + s.r : s.r + ' повт.';
}
function cardioMinOf(w){ return (w.exercises || []).filter(e => e.cardio).reduce((a, e) => a + e.sets.reduce((b, s) => b + (s.t || 0), 0), 0); }
function wSummary(w){
  const p = [];
  if(w.volume) p.push(fmtN(w.volume) + ' кг');
  const c = cardioMinOf(w); if(c) p.push(fmtN(c) + ' мин кардио');
  return p.join(' · ') || 'без веса';
}
function isCardioId(id){
  const e = exById(id); if(e) return !!e.cardio;
  return workouts().some(w => w.exercises.some(x => x.exId === id && x.cardio));
}
function reduced(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }

function exById(id){ return LIB.find(e => e.id === id) || (S.settings.custom || []).find(e => e.id === id) || null; }
function allExercises(){ return LIB.concat(S.settings.custom || []); }

let _wc = [], _wv = -1;
function workouts(){
  if(_wv !== S.ver){
    _wc = Object.values(S.docs).filter(d => d && d.kind === 'workout' && Array.isArray(d.exercises)).sort((a,b) => b.startedAt - a.startedAt);
    _wv = S.ver;
  }
  return _wc;
}
function customPrograms(){ return Object.values(S.docs).filter(d => d && d.kind === 'program' && Array.isArray(d.items)).sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); }
function lastSession(exId, excludeId){
  for(const w of workouts()){
    if(w.id === excludeId) continue;
    const e = w.exercises.find(x => x.exId === exId);
    if(e && e.sets.length) return {at:w.startedAt, sets:e.sets};
  }
  return null;
}
function bestE1(exId, excludeId){
  let b = 0;
  for(const w of workouts()){
    if(w.id === excludeId) continue;
    for(const e of w.exercises) if(e.exId === exId) for(const s of e.sets) b = Math.max(b, e1rm(s.w, s.r));
  }
  return b;
}

/* ---------- storage: everything lives on this phone ----------
   IndexedDB database "bigcore": store "docs" (workouts, programs, measurements, settings,
   the running workout) and store "photos" (full-size measurement photos as JPEG data URLs).
   If IndexedDB is unavailable, docs fall back to localStorage. */
let activeTimer = null;
const IDB_NAME = 'bigcore', LS_KEY = 'bigcore:v1', PHOTO_LS = 'bigcore-photo-', LAST_BACKUP = 'bigcore:lastBackup';
const IDB = {
  db:null,
  open(){
    return new Promise((res, rej) => {
      let r;
      try{ r = indexedDB.open(IDB_NAME, 1); }catch(e){ rej(e); return; }
      r.onupgradeneeded = () => {
        const d = r.result;
        if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs');
        if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { try{ this.db.close(); }catch(e){} }; res(this.db); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    });
  },
  all(store){
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, 'readonly'), out = {};
      const c = t.objectStore(store).openCursor();
      c.onsuccess = () => { const cur = c.result; if(cur){ out[cur.key] = cur.value; cur.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(store, k){
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, 'readonly'); let v = null;
      const r = t.objectStore(store).get(k); r.onsuccess = () => { v = r.result == null ? null : r.result; };
      t.oncomplete = () => res(v); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  write(store, entries, clear){
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, 'readwrite'), os = t.objectStore(store);
      if(clear) os.clear();
      for(const [k, v] of entries){ if(v === null) os.delete(k); else os.put(v, k); }
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
    });
  }
};
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
let persistAsked = false;
function askPersist(){
  if(persistAsked) return; persistAsked = true;
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
}
function isQuota(e){ return !!e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 'local_full'); }

const Store = {
  mode:'pending', q:new Map(), timer:null, writing:false, again:false, fails:0,
  busy(k){ return this.q.has(k); },
  put(k, d){ S.docs[k] = d; S.ver++; this.q.set(k, d); this.schedule(); },
  del(k){ delete S.docs[k]; S.ver++; this.q.set(k, null); this.schedule(); },
  schedule(){ if(this.mode === 'pending') return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 120); },
  flushNow(){ clearTimeout(this.timer); return this.flush(); },
  async flush(){
    if(this.mode === 'pending' || !this.q.size) return;
    if(this.mode === 'memory'){ this.q.clear(); return; }
    if(this.mode === 'local'){
      this.q.clear();
      if(lsSet(LS_KEY, S.docs)){ setSync('saved'); askPersist(); }
      else { setSync('error'); toast('Не удалось сохранить: память телефона для приложения заполнена.'); }
      return;
    }
    if(this.writing){ this.again = true; return; }
    const batch = [...this.q]; this.q.clear(); this.writing = true; setSync('saving');
    try{
      await IDB.write('docs', batch);
      this.fails = 0; setSync('saved'); askPersist();
    }catch(e){
      for(const [k, v] of batch) if(!this.q.has(k)) this.q.set(k, v);
      this.fails++; setSync('error');
      if(isQuota(e)) toast('Память телефона для приложения заполнена. Удалите старые фото в «Замерах».');
      else if(this.fails === 1) toast('Не удалось сохранить. Пробую ещё раз.');
      if(this.fails < 4) setTimeout(() => this.schedule(), 2500*this.fails);
    }finally{
      this.writing = false;
      if(this.again){ this.again = false; if(this.q.size) this.schedule(); }
    }
  }
};

let readyResolve = null;
const storeReady = new Promise(r => { readyResolve = r; });

/* Full-size photos sit in their own store; measurement entries keep only small thumbnails. */
const Photos = {
  cache:new Map(),
  async put(id, data){
    await storeReady;
    this.cache.set(id, data);
    if(Store.mode === 'idb'){
      try{ await IDB.write('photos', [[id, data]]); }
      catch(e){ this.cache.delete(id); throw isQuota(e) ? {code:'local_full'} : e; }
    } else if(Store.mode === 'local'){
      try{ localStorage.setItem(PHOTO_LS + id, data); }
      catch(e){ this.cache.delete(id); throw {code:'local_full'}; }
    }
  },
  async get(id){
    if(this.cache.has(id)) return this.cache.get(id);
    await storeReady;
    let d = null;
    if(Store.mode === 'idb') d = await IDB.get('photos', id);
    else if(Store.mode === 'local'){ try{ d = localStorage.getItem(PHOTO_LS + id); }catch(e){} }
    if(d) this.cache.set(id, d);
    return d;
  },
  async del(id){
    this.cache.delete(id);
    await storeReady;
    if(Store.mode === 'idb') await IDB.write('photos', [[id, null]]);
    else if(Store.mode === 'local'){ try{ localStorage.removeItem(PHOTO_LS + id); }catch(e){} }
  },
  async all(){
    await storeReady;
    if(Store.mode === 'idb') return await IDB.all('photos');
    const out = {};
    if(Store.mode === 'local'){
      try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.indexOf(PHOTO_LS) === 0) out[k.slice(PHOTO_LS.length)] = localStorage.getItem(k); } }catch(e){}
    }
    for(const [k, v] of this.cache) if(!(k in out)) out[k] = v;
    return out;
  },
  async replaceAll(map){
    await storeReady;
    this.cache.clear();
    if(Store.mode === 'idb') await IDB.write('photos', Object.entries(map), true);
    else if(Store.mode === 'local'){
      try{
        const old = []; for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.indexOf(PHOTO_LS) === 0) old.push(k); }
        old.forEach(k => localStorage.removeItem(k));
        for(const [k, v] of Object.entries(map)) localStorage.setItem(PHOTO_LS + k, v);
      }catch(e){ throw {code:'local_full'}; }
    } else for(const [k, v] of Object.entries(map)) this.cache.set(k, v);
  }
};

async function shareFile(name, text, mime){
  let file = null;
  try{ file = new File([text], name, {type:mime}); }catch(e){}
  if(file && navigator.canShare && navigator.share){
    let ok = false; try{ ok = navigator.canShare({files:[file]}); }catch(e){}
    if(ok){
      try{ await navigator.share({files:[file]}); return 'shared'; }
      catch(e){ if(e && e.name === 'AbortError') return 'cancel'; }
    }
  }
  const blob = file || new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a'); el.href = url; el.download = name; el.rel = 'noopener';
  document.body.append(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return 'downloaded';
}

function beep(){
  if(!S.settings.sound) return;
  try{
    if(actx){
      const t0 = actx.currentTime;
      [0, .28, .56].forEach((d, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = i === 2 ? 1320 : 880;
        g.gain.setValueAtTime(.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(.12, t0 + d + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .2);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + d); o.stop(t0 + d + .22);

    }

  try{ if(navigator.vibrate) navigator.vibrate([180, 90, 180, 90, 260]); }catch(e){}

/* ---------- seven-segment rest clock ---------- */
function HS(y){ return `8,${y} 11.5,${y-3.5} 28.5,${y-3.5} 32,${y} 28.5,${y+3.5} 11.5,${y+3.5}`; }
function VS(x, y0, y1){ return `${x},${y0} ${x+3.5},${y0+3.5} ${x+3.5},${y1-3.5} ${x},${y1} ${x-3.5},${y1-3.5} ${x-3.5},${y0+3.5}`; }
const SEGS = {a:HS(4), b:VS(36,6,34), c:VS(36,38,66), d:HS(68), e:VS(4,38,66), f:VS(4,6,34), g:HS(36)};
const DIG = {0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
function sevenSeg(str){
  let x = 0, out = '';
  for(let i = 0; i < str.length; i++){
    const ch = str[i];
    if(ch === ':'){ out += `<circle cx="${x+6}" cy="25" r="4" class="on"/><circle cx="${x+6}" cy="47" r="4" class="on"/>`; x += 20; continue; }
    const lit = (i === 0 && ch === '0') ? '' : DIG[ch];
    out += `<g transform="translate(${x} 0)">` + Object.keys(SEGS).map(k => `<polygon points="${SEGS[k]}" class="${lit.indexOf(k) > -1 ? 'on' : 'off'}"/>`).join('') + '</g>';
    x += 48;
  }
  return `<svg viewBox="0 0 ${x+4} 72" aria-hidden="true"><g transform="skewX(-6) translate(8 0)">${out}</g></svg>`;
}
let lastDigits = '', restTick = null;
function setDigits(secs){
  const m = Math.min(99, Math.floor(secs/60)), s = secs % 60;
  const str = pad(m) + ':' + pad(s);
  if(str !== lastDigits){ lastDigits = str; $('#clock-digits').innerHTML = sevenSeg(str); $('#clock .clock-inner').setAttribute('aria-label', 'Таймер отдыха, осталось ' + m + ' мин ' + s + ' сек'); }
}
function startRest(sec){ S.rest = {end:Date.now() + sec*1000, total:sec*1000, fired:false}; showClock(); }
function showClock(){
  const c = $('#clock'); c.hidden = false; c.classList.remove('is-over');
  document.body.classList.add('has-clock');
  updClock(); clearInterval(restTick); restTick = setInterval(updClock, 200);
}
function stopRest(){
  S.rest = null; clearInterval(restTick); restTick = null;
  const c = $('#clock'); if(c){ c.hidden = true; c.classList.remove('is-over'); }
  document.body.classList.remove('has-clock');
}
function updClock(){
  if(!S.rest) return;
  const left = Math.max(0, S.rest.end - Date.now());
  setDigits(Math.ceil(left/1000));
  $('#clock-fill').style.width = (100*(1 - left/S.rest.total)).toFixed(1) + '%';
  if(left === 0 && !S.rest.fired){
    S.rest.fired = true; $('#clock').classList.add('is-over'); beep();
    const r = S.rest; setTimeout(() => { if(S.rest === r) stopRest(); }, 6000);
  }
}

/* ---------- plates ---------- */
const PH = {25:96, 20:96, 15:84, 10:70, 5:52, 2.5:40, 1.25:32};
const PT = {25:14, 20:12, 15:10, 10:8, 5:6, 2.5:5, 1.25:4};
let svgN = 0;
function calcPlates(total, bar, avail){
  let side = (total - bar)/2;
  const plates = [];
  for(const p of avail.slice().sort((a,b) => b - a)){ while(side >= p - 1e-9){ plates.push(p); side -= p; } }
  return {plates, rest:Math.round(side*1000)/1000};
}
function barbellSVG(plates){
  const id = 'kn' + (++svgN), cy = 55, room = 78;
  const sum = plates.reduce((a, p) => a + (PT[p] || 4) + 1.5, 0);
  const k = sum > room ? room/sum : 1;
  let L = '', R = '', xr = 274, xl = 86;
  for(const p of plates){
    const t = (PT[p] || 4)*k, h = PH[p] || 30, v = PLATE_VAR[p] || '--p1';
    R += `<rect x="${xr.toFixed(1)}" y="${cy - h/2}" width="${t.toFixed(1)}" height="${h}" rx="2" fill="var(${v})" stroke="var(--plate-edge)"/>`;
    L += `<rect x="${(xl - t).toFixed(1)}" y="${cy - h/2}" width="${t.toFixed(1)}" height="${h}" rx="2" fill="var(${v})" stroke="var(--plate-edge)"/>`;
    xr += t + 1.5*k; xl -= t + 1.5*k;
  }
  const label = plates.length ? 'Штанга: на каждую сторону ' + plates.map(fmtN).join(' + ') + ' кг' : 'Пустой гриф';
  return `<svg class="bb-svg" viewBox="0 0 360 110" role="img" aria-label="${esc(label)}">
    <defs><pattern id="${id}" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="var(--bar)"/><path d="M0 0v3" stroke="var(--bar-hi)" stroke-width="1"/></pattern></defs>
    <rect x="96" y="${cy-3}" width="168" height="6" rx="1" fill="url(#${id})"/>
    <rect x="6" y="${cy-6}" width="82" height="12" rx="2" fill="var(--bar-hi)" stroke="var(--plate-edge)"/>
    <rect x="272" y="${cy-6}" width="82" height="12" rx="2" fill="var(--bar-hi)" stroke="var(--plate-edge)"/>
    <rect x="86" y="${cy-10}" width="10" height="20" rx="2" fill="var(--bar)"/>
    <rect x="264" y="${cy-10}" width="10" height="20" rx="2" fill="var(--bar)"/>
    ${L}${R}</svg>`;
}
function platesBlock(total){
  const bar = S.settings.bar;
  if(total == null || total <= 0) return '<p class="hint">Введите вес — покажу, какие блины повесить.</p>';
  if(total < bar) return `<p class="hint">Вес меньше грифа (${fmtN(bar)} кг).</p>`;
  const {plates, rest} = calcPlates(total, bar, S.settings.plates);
  const cap = plates.length ? `На каждую сторону: <b>${plates.map(fmtN).join(' + ')}</b>` : `Только гриф, ${fmtN(bar)} кг`;
  const warn = rest > 0 ? `<span class="warn">Ровно ${fmtN(total)} кг не собрать из этих блинов. Ближайший вес — ${fmtN(total - rest*2)} кг.</span>` : '';
  return `<figure class="barbell">${barbellSVG(plates)}<figcaption><span>${cap}</span>${warn}</figcaption></figure>`;
}

/* ---------- workout model ---------- */
function effW(s){ return s.w !== '' ? num(s.w) : (s.hw != null ? s.hw : null); }
/* o: {count, reps (minutes for cardio), from (saved sets to copy), name, cardio} */
function newEx(id, o){
  o = o || {};
  const e = exById(id);
  const cardio = e ? !!e.cardio : !!o.cardio;
  let src = o.from;
  if(!src){ const l = lastSession(id, S.active && S.active.id); src = l ? l.sets : null; }
  const n = o.count || (src && src.length) || (cardio ? 1 : 3);
  const sets = [];
  for(let i = 0; i < n; i++){
    const p = src && src.length ? (src[i] || src[src.length - 1]) : null;
    let hw, hr;
    if(cardio){ hw = p && p.t != null ? p.t : (o.reps || 20); hr = p && p.d ? p.d : null; }
    else { hw = p && p.w != null ? p.w : (e && e.bw ? 0 : null); hr = p && p.r != null ? p.r : (o.reps || 10); }
    sets.push({w:'', r:'', hw, hr, done:false, rec:false});
  }
  return {k:uid(), exId:id, n:e ? e.n : (o.name || id), g:e ? e.g : (cardio ? 'Кардио' : 'Другое'), bb:!!(e && e.bb), bw:!!(e && e.bw), cardio, sets};
}
function startWorkout(name, programId, exercises){
  if(S.active){ toast('Сначала завершите текущую тренировку'); S.tab = 'workout'; render(); return false; }
  unlockAudio();
  const now = Date.now();
  S.active = {id:'w-' + now.toString(36), name, programId:programId || null, startedAt:now, exercises:[]};
  S.active.exercises = exercises();
  S.platesOpen.clear();
  touchActive(true); keepAwake(true);
  S.tab = 'workout'; render(); window.scrollTo(0, 0);
  return true;
}
function metrics(w){
  let done = 0, total = 0, vol = 0, cmin = 0;
  for(const e of w.exercises) for(const s of e.sets){
    total++;
    if(s.done){ done++; if(e.cardio) cmin += num(s.w) || 0; else vol += (num(s.w) || 0)*(num(s.r) || 0); }
  }
  return {done, total, vol, cmin};
}
function recalcRecs(i){
  const ex = S.active.exercises[i];
  if(ex.cardio){ ex.sets.forEach(s => { s.rec = false; }); return null; }
  const prev = bestE1(ex.exId, S.active.id);
  let bestJ = -1, best = 0;
  ex.sets.forEach((s, j) => { s.rec = false; if(s.done){ const v = e1rm(num(s.w) || 0, num(s.r) || 0); if(v > best){ best = v; bestJ = j; } } });
  if(bestJ > -1 && prev > 0 && best > prev + 1e-9){ ex.sets[bestJ].rec = true; return {j:bestJ, v:best}; }
  return null;
}

function weekStreak(ws){
  const have = new Set(ws.map(w => weekStart(w.startedAt)));
  const d = new Date(weekStart(Date.now()));
  if(!have.has(d.getTime())) d.setDate(d.getDate() - 7);
  let n = 0;
  while(have.has(d.getTime())){ n++; d.setDate(d.getDate() - 7); }
  return n;
}
function exStats(exId){
  let bw = null, be = 0, mr = null, n = 0;
  for(const w of workouts()){
    const e = w.exercises.find(x => x.exId === exId); if(!e) continue; n++;
    for(const s of e.sets){
      if(!bw || s.w > bw.w || (s.w === bw.w && s.r > bw.r)) bw = s;
      be = Math.max(be, e1rm(s.w, s.r));
      if(!mr || s.r > mr.r || (s.r === mr.r && s.w > mr.w)) mr = s;
    }
  }
  return {bw, be, mr, n};
}
function cardioSessions(exId){

  for(const w of workouts()){
    const e = w.exercises.find(x => x.exId === exId); if(!e) continue;
    out.push({at:w.startedAt, t:e.sets.reduce((a, s) => a + (s.t || 0), 0), d:e.sets.reduce((a, s) => a + (s.d || 0), 0)});
  }
  return out;
}

function niceTicks(min, max, count){
  if(!(max > min)){ max = min + 1; }
  const raw = (max - min)/count, mag = Math.pow(10, Math.floor(Math.log10(raw))), nrm = raw/mag;
  const step = (nrm < 1.5 ? 1 : nrm < 3 ? 2 : nrm < 7 ? 5 : 10)*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const t = []; for(let v = lo; v <= hi + step/2; v += step) t.push(Math.round(v*1000)/1000);
  return t;
}
function drawWeeks(){
  const el = $('#ch-weeks'); if(!el) return;
  const W = Math.max(280, el.clientWidth), H = 200, pl = 44, pr = 6, pt = 12, pb = 26;
  const cur = weekStart(Date.now()), weeks = [];
  for(let k = 9; k >= 0; k--){ const d = new Date(cur); d.setDate(d.getDate() - 7*k); weeks.push({s:d.getTime(), v:0, n:0}); }
  for(const w of workouts()){ const b = weeks.find(x => x.s === weekStart(w.startedAt)); if(b){ b.v += w.volume || 0; b.n++; } }
  const ticks = niceTicks(0, Math.max(...weeks.map(b => b.v), 1)/1000, 3);
  const top = ticks[ticks.length - 1]*1000 || 1;
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw/weeks.length;
  const y = v => pt + ih - (v/top)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Тоннаж по неделям">`;
  for(const t of ticks){ const yy = y(t*1000); s += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"${t ? ' stroke-dasharray="2 4"' : ''}/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${fmtN(t)} т</text>`; }
  weeks.forEach((b, i) => {
    const x = pl + i*bw + bw*0.18, w = bw*0.64, yy = y(b.v), hgt = Math.max(0, pt + ih - yy);
    const curW = i === weeks.length - 1;
    s += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${hgt.toFixed(1)}" rx="2" fill="var(${curW ? '--accent' : '--bar-past'})"><title>Неделя с ${shortDate(b.s)}: ${fmtN(b.v)} кг, ${b.n} ${plural(b.n, ['тренировка','тренировки','тренировок'])}</title></rect>`;
    if((weeks.length - 1 - i) % 2 === 0) s += `<text x="${(x + w/2).toFixed(1)}" y="${H - 6}" text-anchor="middle"${curW ? ' class="lbl-strong" style="font-size:12px"' : ''}>${esc(shortDate(b.s))}</text>`;
  });
  el.innerHTML = s + '</svg>';
}
function drawEx(){
  const el = $('#ch-ex'); if(!el) return;
  let pts, unit = 'кг';
  if(isCardioId(S.progEx)){
    const ss = cardioSessions(S.progEx).reverse();
    const useD = ss.some(s => s.d > 0);
    unit = useD ? 'км' : 'мин';
    pts = ss.map(s => ({t:s.at, v:useD ? s.d : s.t})).filter(p => p.v > 0);
  } else {
    pts = workouts().slice().reverse().map(w => {
      const e = w.exercises.find(x => x.exId === S.progEx); if(!e) return null;
      return {t:w.startedAt, v:Math.max(0, ...e.sets.map(s => e1rm(s.w, s.r)))};
    }).filter(p => p && p.v > 0);
  }
  if(!pts.length){ el.innerHTML = '<p class="hint">Подходов с весом пока нет, поэтому графика расчётного 1ПМ нет. Рекорды по повторам — в таблице выше.</p>'; return; }
  lineChart(el, pts, unit, unit === 'кг' ? 'Расчётный 1ПМ по тренировкам' : unit === 'км' ? 'Дистанция по тренировкам' : 'Минуты по тренировкам');
}
function lineChart(el, pts, unit, label){
  const W = Math.max(280, el.clientWidth), H = 220, pl = 44, pr = 18, pt = 26, pb = 26;
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const padMin = unit === 'км' || unit === '%' ? 1 : 3;
  if(hi - lo < padMin){ lo -= padMin; hi += padMin; }
  const ticks = niceTicks(Math.max(0, lo - (hi - lo)*0.1), hi + (hi - lo)*0.1, 4);
  const t0 = ticks[0], t1 = ticks[ticks.length - 1];
  const iw = W - pl - pr, ih = H - pt - pb;
  const tm0 = pts[0].t, tm1 = pts[pts.length - 1].t;
  const x = t => pts.length === 1 || tm1 === tm0 ? pl + iw/2 : pl + (t - tm0)/(tm1 - tm0)*iw;
  const y = v => pt + ih - (v - t0)/(t1 - t0)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">`;
  for(const t of ticks){ const yy = y(t); s += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${fmtN(t)}</text>`; }
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  if(pts.length > 1){
    s += `<path d="${line} L${x(tm1).toFixed(1)} ${pt + ih} L${x(tm0).toFixed(1)} ${pt + ih} Z" fill="var(--accent)" fill-opacity=".12"/>`;
    s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    s += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 5.5 : 3}" fill="var(${last ? '--accent' : '--surface'})" stroke="var(--accent)" stroke-width="2"><title>${shortDate(p.t)}: ${fmtN(round1(p.v))} ${unit}</title></circle>`;
  });
  const lp = pts[pts.length - 1], lx = x(lp.t), anchor = lx > W - 60 ? 'end' : lx < pl + 40 ? 'start' : 'middle';
  s += `<text x="${lx.toFixed(1)}" y="${(y(lp.v) - 12).toFixed(1)}" text-anchor="${anchor}" class="lbl-strong">${fmtN(round1(lp.v))} ${unit}</text>`;
  s += `<text x="${pts.length > 1 ? pl : pl + iw/2}" y="${H - 6}" text-anchor="${pts.length > 1 ? 'start' : 'middle'}">${esc(shortDate(tm0))}</text>`;
  if(pts.length > 1) s += `<text x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(shortDate(tm1))}</text>`;
  el.innerHTML = s + '</svg>';
}

const fLong = DF({day:'numeric', month:'long', year:'numeric'});
const fDots = DF({day:'2-digit', month:'2-digit', year:'numeric'});
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dateOf(s){ const p = String(s).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
function longDate(s){ return fLong.format(dateOf(s)).replace(/\s*г\.$/, ''); }
function dotDate(s){ return fDots.format(dateOf(s)); }
function endDot(s){ return /\.$/.test(s) ? s : s + '.'; }
function signed(n){ if(n == null) return ''; const r = Math.round(n*10)/10; if(r === 0) return '±0'; return (r > 0 ? '+' : '−') + fmtN(Math.abs(r)); }
function bodyEntries(){

async function loadImage(file){
  if(window.createImageBitmap){ try{ return await createImageBitmap(file); }catch(e){} }
  return await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function encodeImg(img, maxSide, q){
  const w0 = img.width, h0 = img.height, k = Math.min(1, maxSide/Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0*k)), h = Math.max(1, Math.round(h0*k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  return {url:c.toDataURL('image/jpeg', q), w, h};
}
async function processPhoto(file){
  const img = await loadImage(file);
  if(!img.width || !img.height) throw new Error('empty');
  let full = null;
  for(const [m, q] of [[1080, .75], [960, .7], [840, .66], [720, .6], [600, .55]]){ full = encodeImg(img, m, q); if(full.url.length < 235000) break; }
  if(!full || full.url.length >= 235000) throw new Error('too_big');
  const thumb = encodeImg(img, 240, .6);
  if(img.close) try{ img.close(); }catch(e){}
  return {id:'ph-' + Date.now().toString(36) + uid().slice(0, 4), thumb:thumb.url, full:full.url, w:full.w, h:full.h, fresh:true};
}

function renderBodyPhotos(){

/* ---------- calories ----------
   Day documents "k-YYYY-MM-DD": {kind:'day', date, food:[{id,name,kcal,p,f,c,meal}], acts:[{id,type,name,min,kcal}], spent}
   spent = number typed from a watch (overrides the estimate) or null.
   Estimate = Mifflin–St Jeor BMR × activity outside the gym + workouts of that day + other activity.
   Workouts and activities count (MET − 1) × kg × hours, i.e. only what is burned above the base. */
const MEALS = ['Завтрак','Обед','Ужин','Перекус'];
const ACT_PRESETS = [
  ['walk','Ходьба',3.5], ['fastwalk','Быстрая ходьба',5], ['run','Бег',9], ['bike','Велосипед',7],
  ['swim','Плавание',6], ['board','Сноуборд, лыжи',5.3], ['games','Футбол, игры',7], ['home','Работа по дому, на участке',3.5],
  ['custom','Своё',0]
];
const ACT_LEVELS = [[1.2,'Сидячая работа','Офис, машина, мало хожу'],[1.375,'Умеренно на ногах','Хожу 1–2 часа в день'],[1.55,'Физическая работа','Весь день в движении']];
const GOALS = [['cut','Похудеть','съедать на 500 ккал меньше расхода'],['keep','Держать вес','съедать столько же, сколько тратите'],['bulk','Набрать массу','съедать на 300 ккал больше расхода']];
const CARDIO_MET = {treadmill:8, 'incline-walk':6, bike:7, rower:7, elliptical:5, stepper:9, rope:11};
const STRENGTH_MET = 5;
const fDayLong = DF({weekday:'long', day:'numeric', month:'long'});

function dsOf(ts){ const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(ds, k){ const d = dateOf(ds); d.setDate(d.getDate() + k); return dsOf(d.getTime()); }
function calDay(){ return S.calDay || todayStr(); }
function dayLabel(ds){
  const t = todayStr();
  if(ds === t) return 'Сегодня';
  if(ds === addDays(t, -1)) return 'Вчера';
  return cap(fDayLong.format(dateOf(ds)));
}
function dayDoc(ds){ const d = S.docs['k-' + ds]; return d && d.kind === 'day' ? d : null; }
function dayOrNew(ds){
  const d = dayDoc(ds);
  const o = d ? clone(d) : {kind:'day', id:'k-' + ds, date:ds, food:[], acts:[], spent:null};
  if(!Array.isArray(o.food)) o.food = [];
  if(!Array.isArray(o.acts)) o.acts = [];
  return o;
}
function saveDay(d){
  d.updatedAt = Date.now();
  if(!d.food.length && !d.acts.length && d.spent == null) Store.del(d.id); else Store.put(d.id, d);
}
function calProfile(){ const p = S.settings.profile; return p && p.height && p.birthYear && p.sex ? p : null; }
function weightOn(ds){
  const es = bodyEntries().filter(e => e.weight != null);
  const hit = es.find(e => e.date <= ds) || es[es.length - 1];
  if(hit) return +hit.weight;
  const p = S.settings.profile;
  return p && p.weight ? +p.weight : null;
}
function cardioMet(exId, t, d){
  if(exId === 'treadmill' && t > 0 && d > 0){
    const v = d/(t/60);
    return v < 4 ? 2.8 : v < 5 ? 3.5 : v < 6 ? 4.3 : v < 7 ? 6 : v < 8.5 ? 8.3 : v < 10 ? 9.8 : v < 11.5 ? 11 : 11.8;
  }
  return CARDIO_MET[exId] || 7;
}
function workoutKcal(w, kg){
  let cmin = 0, ck = 0, sets = 0;
  for(const e of w.exercises || []){
    if(e.cardio || isCardioId(e.exId)){
      for(const st of e.sets){ const t = +st.t || 0; cmin += t; ck += (cardioMet(e.exId, t, +st.d || 0) - 1)*kg*t/60; }
    } else sets += e.sets.length;
  }
  const dur = Math.max(0, ((w.finishedAt || w.startedAt) - w.startedAt)/60000);
  const smin = sets ? Math.min(Math.max(dur - cmin, sets*2.5), sets*4) : 0;
  return {kcal:Math.round(ck + (STRENGTH_MET - 1)*kg*smin/60), min:Math.round(smin + cmin)};
}
function dayCalc(ds){
  const d = dayDoc(ds), p = calProfile();
  const food = d && Array.isArray(d.food) ? d.food : [], acts = d && Array.isArray(d.acts) ? d.acts : [];
  const eaten = Math.round(food.reduce((a, f) => a + (+f.kcal || 0), 0));
  const mac = {p:0, f:0, c:0, any:false};
  food.forEach(x => { for(const k of ['p','f','c']) if(x[k] != null){ mac[k] += +x[k] || 0; mac.any = true; } });
  const kg = weightOn(ds);
  let bmr = null;
  if(p && kg){ const age = dateOf(ds).getFullYear() - p.birthYear; bmr = 10*kg + 6.25*p.height - 5*age + (p.sex === 'f' ? -161 : 5); }
  const base = bmr != null ? Math.round(bmr*(p.act || 1.2)) : null;
  const wos = kg ? workouts().filter(w => dsOf(w.startedAt) === ds).map(w => Object.assign({w}, workoutKcal(w, kg))) : [];
  const woK = wos.reduce((a, x) => a + x.kcal, 0);
  const actK = Math.round(acts.reduce((a, x) => a + (+x.kcal || 0), 0));
  const manual = d && d.spent != null ? Math.round(+d.spent) : null;
  const spent = manual != null ? manual : base != null ? base + woK + actK : null;
  const goal = (p && p.goal) || 'keep';
  const target = spent != null ? Math.max(1200, spent + (goal === 'cut' ? -500 : goal === 'bulk' ? 300 : 0)) : null;
  return {ds, food, acts, eaten, mac, kg, bmr, base, wos, woK, actK, manual, spent, goal, target, balance:spent != null ? eaten - spent : null};
}
function balanceInfo(c){
  if(c.balance == null) return {txt:'—', sub:'нужен расход', cls:''};
  const b = c.balance, ab = Math.abs(b);
  const sub = ab < 50 ? 'в ноль' : b < 0 ? 'дефицит' : 'профицит';
  let cls = '';
  if(c.eaten > 0){
    if(c.goal === 'cut') cls = b <= -250 ? 'cal-ok' : b > 100 ? 'cal-bad' : '';
    else if(c.goal === 'bulk') cls = b >= 100 ? 'cal-ok' : b < -250 ? 'cal-bad' : '';
    else cls = ab <= 250 ? 'cal-ok' : ab > 500 ? 'cal-bad' : '';
  }
  return {txt:(b > 0 ? '+' : b < 0 ? '−' : '') + fmtN(ab), sub, cls};
}
function macroLine(m){
  return `<div class="macro"><span>Белки <b>${fmtN(Math.round(m.p))}</b> г</span><span>Жиры <b>${fmtN(Math.round(m.f))}</b> г</span><span>Углеводы <b>${fmtN(Math.round(m.c))}</b> г</span></div>`;
}
function calNums(c){
  const bi = balanceInfo(c);
  const eatSub = c.food.length ? c.food.length + ' ' + plural(c.food.length, ['запись','записи','записей']) : 'пока пусто';
  const spentSub = c.manual != null ? 'по данным часов' : c.spent != null ? 'оценка за день' : 'укажите профиль';
  return `<dl class="cal-nums">
    <div><dt>Съедено</dt><dd class="cal-in">${fmtN(c.eaten)}</dd><dd class="sub">${esc(eatSub)}</dd></div>
    <div><dt>Потрачено</dt><dd class="cal-out">${c.spent != null ? fmtN(c.spent) : '—'}</dd><dd class="sub">${esc(spentSub)}</dd></div>
    <div><dt>Баланс</dt><dd class="${bi.cls}">${bi.txt}</dd><dd class="sub">${esc(bi.sub)}</dd></div>
  </dl>`;
}
function calGoal(c){
  if(c.target == null) return '';
  const g = GOALS.find(x => x[0] === c.goal) || GOALS[1];
  const left = c.target - c.eaten;
  const pctW = Math.min(100, c.eaten/c.target*100).toFixed(1);
  const msg = left >= 0 ? `осталось <b>${fmtN(left)}</b> ккал` : `перебор <b>${fmtN(-left)}</b> ккал`;
  return `<div class="cal-goal"><p>Цель «${esc(g[1])}»: до <b>${fmtN(c.target)}</b> ккал, ${msg}</p>
    <div class="cal-track" role="img" aria-label="Съедено ${fmtN(c.eaten)} из ${fmtN(c.target)} ккал"><i class="${left < 0 ? 'over' : ''}" style="width:${pctW}%"></i></div></div>`;
}
function calBlock(){

  const setup = c.manual == null && !calProfile() ? `<div class="cal-setup"><p>Чтобы считать потраченные калории, укажите пол, возраст и рост. Вес возьмётся из «Замеров».</p><button type="button" class="btn btn-small btn-primary" data-act="cal-profile">Указать</button></div>` : '';

      <div class="cal-btns"><button type="button" class="btn btn-primary" data-act="cal-food">+ Еда</button><button type="button" class="btn" data-act="cal-act">+ Активность</button><button type="button" class="btn" data-act="cal-detail">За день</button></div>
      <div class="cal-week"><div class="cal-legend"><span><i style="background:var(--accent)"></i>Съедено</span><span><i style="background:var(--gold)"></i>Потрачено</span><span>за 7 дней, нажмите на день</span></div><div id="cal-week"></div></div>
    </div>

function drawCalWeek(){
  const el = $('#cal-week'); if(!el) return;
  const end = calDay(), days = [];
  for(let k = 6; k >= 0; k--) days.push(dayCalc(addDays(end, -k)));
  const W = Math.max(280, el.clientWidth), H = 150, pl = 40, pr = 4, pt = 8, pb = 22;
  const maxV = Math.max(1000, ...days.map(d => Math.max(d.eaten, d.spent || 0)));
  const ticks = niceTicks(0, maxV, 2), top = ticks[ticks.length - 1] || 1;
  const iw = W - pl - pr, ih = H - pt - pb, gw = iw/7, bw = Math.max(5, Math.min(16, gw*0.26));
  const y = v => pt + ih - v/top*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Съедено и потрачено за 7 дней">`;
  for(const t of ticks){ const yy = y(t).toFixed(1); s += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"${t ? ' stroke-dasharray="2 4"' : ''}/><text x="${pl - 6}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${fmtN(t)}</text>`; }
  days.forEach((d, i) => {
    s += `<rect class="hit" x="${(pl + gw*i).toFixed(1)}" y="${pt}" width="${gw.toFixed(1)}" height="${ih + pb - 2}" rx="6" data-act="cal-day" data-ds="${d.ds}"><title>${esc(dayLabel(d.ds))}: съедено ${fmtN(d.eaten)}, потрачено ${d.spent != null ? fmtN(d.spent) : '—'} ккал</title></rect>`;
  });
  days.forEach((d, i) => {
    const cx = pl + gw*i + gw/2, cur = d.ds === end;
    if(d.eaten > 0) s += `<rect class="bar" x="${(cx - bw - 1.5).toFixed(1)}" y="${y(d.eaten).toFixed(1)}" width="${bw.toFixed(1)}" height="${(pt + ih - y(d.eaten)).toFixed(1)}" rx="2" fill="var(--accent)"/>`;
    if(d.spent) s += `<rect class="bar" x="${(cx + 1.5).toFixed(1)}" y="${y(d.spent).toFixed(1)}" width="${bw.toFixed(1)}" height="${(pt + ih - y(d.spent)).toFixed(1)}" rx="2" fill="var(--gold)"/>`;
    s += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" class="${cur ? 'cur' : ''}">${esc(fWeekday.format(dateOf(d.ds)))}</text>`;
  });
  el.innerHTML = s + '</svg>';
}

function defaultMeal(ds){
  if(ds !== todayStr()) return 'Обед';
  const h = new Date().getHours();
  return h < 11 ? 'Завтрак' : h < 16 ? 'Обед' : h < 21 ? 'Ужин' : 'Перекус';
}
function recentFoods(n){
  const out = [], seen = new Set();
  const days = Object.values(S.docs).filter(d => d && d.kind === 'day' && Array.isArray(d.food)).sort((a, b) => a.date < b.date ? 1 : -1);
  for(const d of days) for(let i = d.food.length - 1; i >= 0; i--){
    const f = d.food[i], key = String(f.name || '').trim().toLowerCase();

}

    <div class="fld"><label for="cf-name">Что съели</label><input id="cf-name" class="field" maxlength="60" autocomplete="off" placeholder="Например: гречка с курицей" value="${f ? esc(f.name || '') : ''}"></div>
