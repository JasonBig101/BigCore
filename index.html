  if(S.nx.target === 'active'){ addExToActive(ex.id); toast(`«${ex.n}» сохранено в «Моих упражнениях»`); }
  else { closeSheet(); render(); toast(`«${ex.n}» сохранено`); }
}
function addExToActive(id){
  if(!S.active) return;
  S.active.exercises.push(newEx(id));
  touchActive(true); closeSheet(); render();
  const idx = S.active.exercises.length - 1;
  const el = document.querySelector(`.ex[data-i="${idx}"]`);
  if(el) el.scrollIntoView({block:'start', behavior:reduced() ? 'auto' : 'smooth'});
}

/* ---------- actions ---------- */
async function finishWorkout(){
  const w = S.active; if(!w) return;
  flushActive();
  const exs = w.exercises.map(ex => {
    const o = {exId:ex.exId, name:ex.n, sets:ex.sets.filter(s => s.done).map(s => ex.cardio ? {t:num(s.w) || 0, d:num(s.r) || 0} : {w:num(s.w) || 0, r:num(s.r) || 0})};
    if(ex.cardio) o.cardio = true;
    return o;
  }).filter(e => e.sets.length);
  const m = metrics(w);
  if(!exs.length){
    const ok = await confirmSheet('Нет отмеченных подходов', 'Тренировка без выполненных подходов не попадёт в историю. Закрыть её?', 'Закрыть без сохранения', true);
    if(ok) endActive();
    return;
  }
  const left = m.total - m.done;
  const ok = await confirmSheet('Завершить тренировку?', `В историю попадут ${m.done} ${plural(m.done, ['подход','подхода','подходов'])}${left ? `, ${left} неотмеченных — нет` : ''}.`, 'Завершить', false);
  if(!ok) return;
  const strength = exs.filter(e => !e.cardio);
  const prs = strength.filter(e => { const prev = bestE1(e.exId, w.id); const b = Math.max(...e.sets.map(s => e1rm(s.w, s.r))); return prev > 0 && b > prev + 1e-9; }).map(e => e.exId);
  const vol = Math.round(strength.reduce((a, e) => a + e.sets.reduce((b, s) => b + s.w*s.r, 0), 0)*10)/10;
  const doc = {kind:'workout', id:w.id, name:(w.name || '').trim() || 'Тренировка', programId:w.programId || null, startedAt:w.startedAt, finishedAt:Date.now(), exercises:exs, volume:vol, prs};
  const cmin = cardioMinOf(doc);
  Store.put(w.id, doc);
  endActive(true);
  S.tab = 'history'; S.openHist = w.id; render(); window.scrollTo(0, 0);
  const parts = [vol ? 'тоннаж ' + fmtN(vol) + ' кг' : '', cmin ? 'кардио ' + fmtN(cmin) + ' мин' : '', prs.length ? 'рекордов: ' + prs.length : ''].filter(Boolean);
  toast('Сохранено' + (parts.length ? ' · ' + parts.join(' · ') : ''));
}
function endActive(silent){
  S.active = null; S.platesOpen.clear();
  touchActive(true); keepAwake(false); stopRest();
  if(!silent) render();
}

function onTick(i, j){
  unlockAudio();
  const ex = S.active.exercises[i], s = ex.sets[j];
  if(s.done){ s.done = false; recalcRecs(i); touchActive(); rerenderCard(i); updStats(); return; }
  if(s.w === '' && s.hw != null) s.w = fmtIn(s.hw);
  if(s.r === '' && s.hr != null) s.r = fmtIn(s.hr);
  const w = num(s.w), r = num(s.r);
  const row = document.querySelector(`.ex[data-i="${i}"] .set[data-j="${j}"]`);
  const bad = (f, msg) => { if(row){ row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); const inp = row.querySelector(`[data-f="${f}"]`); inp.value = f === 'w' ? s.w : s.r; inp.focus(); } toast(msg); };
  if(ex.cardio){
    if(!w || w <= 0) return bad('w', 'Впишите, сколько минут');
    s.done = true; touchActive(); rerenderCard(i); updStats();
    return;
  }
  if(w == null && !ex.bw) return bad('w', 'Впишите вес подхода');
  if(!r || r <= 0) return bad('r', 'Впишите число повторений');
  if(s.w === '') s.w = '0';
  s.done = true;
  const rec = recalcRecs(i);
  if(rec && rec.j === j) toast(`Новый рекорд в «${ex.n}»: расчётный 1ПМ ${fmtN(round1(rec.v))} кг`);
  startRest(S.settings.rest);
  touchActive(); rerenderCard(i); updStats();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  const card = b.closest('.ex[data-i]'), i = card ? +card.dataset.i : -1;
  const row = b.closest('.set[data-j]'), j = row ? +row.dataset.j : -1;
  switch(act){
    case 'tab':
      if(S.tab !== b.dataset.tab){ flushActive(); S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }
      else window.scrollTo({top:0, behavior:reduced() ? 'auto' : 'smooth'});
      break;
    case 'start-prog': {
      const p = PROGRAMS.find(x => x.id === id) || customPrograms().find(x => x.id === id);
      if(p) startWorkout(p.name, p.id, () => p.items.map(([eid, n, r]) => newEx(eid, {count:n, reps:r, name:p.names && p.names[eid]})));
      break;
    }
    case 'start-empty':
      if(startWorkout('Тренировка', null, () => [])) openLib();
      break;
    case 'repeat': {
      const w = workouts().find(x => x.id === id);
      if(w) startWorkout(w.name, w.programId, () => w.exercises.map(e => newEx(e.exId, {count:e.sets.length, from:e.sets, name:e.name, cardio:e.cardio})));
      break;
    }
    case 'del-prog': {
      const p = customPrograms().find(x => x.id === id); if(!p) break;
      if(await confirmSheet('Удалить программу?', `«${p.name}» пропадёт из списка. Тренировки по ней останутся в истории.`, 'Удалить', true)){ Store.del(id); render(); }
      break;
    }
    case 'tick': if(i > -1 && j > -1) onTick(i, j); break;
    case 'add-set': {
      const ex = S.active.exercises[i], l = ex.sets[ex.sets.length - 1];
      ex.sets.push({w:'', r:'', hw:l ? effW(l) : null, hr:l ? (num(l.r) != null ? num(l.r) : l.hr) : 10, done:false, rec:false});
      touchActive(); rerenderCard(i); updStats();
      break;
    }
    case 'rm-set': {
      const ex = S.active.exercises[i]; if(ex.sets.length > 1){ ex.sets.pop(); recalcRecs(i); touchActive(); rerenderCard(i); updStats(); }
      break;
    }
    case 'plates': {
      const k = S.active.exercises[i].k; if(S.platesOpen.has(k)) S.platesOpen.delete(k); else S.platesOpen.add(k);
      rerenderCard(i);
      break;
    }
    case 'rm-ex': {
      const ex = S.active.exercises[i];
      const done = ex.sets.filter(s => s.done).length;
      if(done && !(await confirmSheet('Убрать упражнение?', `«${ex.n}»: отмеченные подходы (${done}) не сохранятся.`, 'Убрать', true))) break;
      S.active.exercises.splice(i, 1); touchActive(true); render();
      break;
    }
    case 'cal-prev': S.calDay = addDays(calDay(), -1); render(); break;
    case 'cal-next': { const n = addDays(calDay(), 1); S.calDay = n >= todayStr() ? null : n; render(); break; }
    case 'cal-day': S.calDay = b.dataset.ds >= todayStr() ? null : b.dataset.ds; render(); break;
    case 'cal-food': openFood(calDay(), null, false); break;
    case 'cf-new-in': openFood(calDay(), null, true); break;
    case 'cf-edit': openFood(calDay(), id, true); break;
    case 'cf-recent': {

      $('#cf-p').value = fmtIn(r.p); $('#cf-f').value = fmtIn(r.f); $('#cf-c').value = fmtIn(r.c);

    }

    case 'cal-profile': openCalProfile(); break;
    case 'cp-sex': if(S.cp){ S.cp.sex = b.dataset.v; syncPressed('cp-sex', S.cp.sex); } break;
    case 'cp-act': if(S.cp){ S.cp.act = +b.dataset.v; syncPressed('cp-act', S.cp.act); } break;
    case 'cp-goal': if(S.cp){ S.cp.goal = b.dataset.v; syncPressed('cp-goal', S.cp.goal); } break;
    case 'cp-save': cpSave(); break;
    case 'body-new': openBodyForm(null); break;
    case 'body-edit': openBodyForm(id); break;
    case 'body-save': bodySave(); break;
    case 'bm-rm': {
      if(!S.bf) break;
      const p = S.bf.photos.splice(+b.dataset.n, 1)[0];
      if(p && !p.fresh) S.bf.removed.push(p.id);
      renderBodyPhotos();
      break;
    }
    case 'body-del': {
      const e = S.bf && S.docs[S.bf.id]; if(!e) break;
      const n = (e.photos || []).length;
      if(await confirmSheet('Удалить замер?', `Замер от ${longDate(e.date)}${n ? ' и ' + n + ' ' + plural(n, ['фото','фото','фото']) + ' к нему' : ''} удалятся. Отменить это нельзя.`, 'Удалить', true)){
        Store.del(e.id); (e.photos || []).forEach(p => Photos.del(p.id).catch(() => {}));
        S.bf = null; render(); toast('Замер удалён');
      }
      break;

    case 'ph-step': if(S.pv){ S.pv.idx = Math.max(0, S.pv.idx + (+b.dataset.d)); showPhoto(); } break;
    case 'ph-compare': showCompare(); break;
    case 'ph-back': showPhoto(); break;
    case 'move': {
      const d = +b.dataset.d, k = i + d, arr = S.active ? S.active.exercises : [];
      if(i < 0 || k < 0 || k >= arr.length) break;
      const tmp = arr[i]; arr[i] = arr[k]; arr[k] = tmp;
      touchActive(true); render();
      const el = document.querySelector(`.ex[data-i="${k}"]`);
      if(el){
        el.classList.add('moved');
        el.scrollIntoView({block:'nearest', behavior:reduced() ? 'auto' : 'smooth'});
        const same = el.querySelector(`[data-act="move"][data-d="${d}"]`);
        const btn = same && !same.disabled ? same : el.querySelector('[data-act="move"]:not([disabled])');
        if(btn) btn.focus({preventScroll:true});
      }
      break;
    }
    case 'open-lib': openLib(); break;
    case 'lib-g': S.libGroup = b.dataset.g; document.querySelectorAll('[data-act="lib-g"]').forEach(x => x.setAttribute('aria-pressed', x === b)); fillLib(); break;
    case 'lib-add': addExToActive(id); break;
    case 'lib-custom':
    case 'new-ex': openNewEx(S.libQ.trim(), 'active'); break;
    case 'new-ex-tools': openNewEx('', 'list'); break;
    case 'nx-g': S.nx.g = b.dataset.g; if(S.nx.g === 'Кардио') S.nx.t = 'cardio'; else if(S.nx.t === 'cardio') S.nx.t = 'w'; nxSync(); break;
    case 'nx-t': S.nx.t = b.dataset.v; if(S.nx.t === 'cardio') S.nx.g = 'Кардио'; else if(S.nx.g === 'Кардио') S.nx.g = 'Другое'; nxSync(); break;

        S.settings.custom = S.settings.custom.filter(x => x.id !== id); saveSettings(); render();
      }
      break;
    }
    case 'finish': finishWorkout(); break;
    case 'cancel-wo':
      if(await confirmSheet('Отменить тренировку?', 'Все подходы этой тренировки будут удалены и не попадут в историю.', 'Отменить тренировку', true)) endActive();
      break;
    case 'save-prog':
      if(!S.active.exercises.length){ toast('Добавьте упражнения, чтобы сохранить программу'); break; }
      openSheet(`<div class="sheet-head"><h2>Новая программа</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Закрыть">✕</button></div>

        <button type="button" class="btn btn-primary big" data-act="save-prog-ok">Сохранить программу</button>`);
      break;
    case 'save-prog-ok': {
      const name = ($('#prog-name').value || '').trim() || 'Моя программа';
      const pid = 'p-' + Date.now().toString(36);
      const names = {}; S.active.exercises.forEach(e => { names[e.exId] = e.n; });
      Store.put(pid, {kind:'program', id:pid, name, note:'', createdAt:Date.now(), names,
        items:S.active.exercises.map(e => { const l = e.sets[e.sets.length - 1]; return [e.exId, e.sets.length, e.cardio ? ((l && (num(l.w) || l.hw)) || 20) : ((l && (num(l.r) || l.hr)) || 10)]; })});
      closeSheet(); toast(`Программа «${name}» сохранена`);
      break;
    }
    case 'toggle-hist': S.openHist = S.openHist === id ? null : id; render(); break;
    case 'del-wo': {
      const w = workouts().find(x => x.id === id); if(!w) break;
      if(await confirmSheet('Удалить тренировку?', `«${w.name}» от ${shortDate(w.startedAt)} удалится из истории и графиков. Отменить это нельзя.`, 'Удалить', true)){
        Store.del(id); if(S.openHist === id) S.openHist = null; render(); toast('Тренировка удалена');
      }
      break;
    }
    case 'close-sheet': closeSheet(false); break;
    case 'sheet-ok': closeSheet(true); break;
    case 'rest-plus':
      if(S.rest){
        if(S.rest.fired){ S.rest = {end:Date.now() + 15000, total:15000, fired:false}; showClock(); }
        else { S.rest.end += 15000; S.rest.total += 15000; updClock(); }
      }
      break;
    case 'rest-minus': if(S.rest && !S.rest.fired){ S.rest.end = Math.max(Date.now(), S.rest.end - 15000); updClock(); } break;
    case 'rest-skip': stopRest(); break;
    case 't-step': {
      S.tools.target = Math.max(0, Math.round(((S.tools.target || 0) + parseFloat(b.dataset.d))*100)/100);
      $('#t-target').value = fmtIn(S.tools.target); $('#plate-out').innerHTML = platesBlock(S.tools.target);
      break;
    }
    case 'set-bar': S.settings.bar = +b.dataset.v; saveSettings(); render(); break;
    case 'toggle-plate': {
      const v = parseFloat(b.dataset.v), set = new Set(S.settings.plates);
      if(set.has(v)) set.delete(v); else set.add(v);
      S.settings.plates = ALL_PLATES.filter(p => set.has(p)); saveSettings(); render();
      break;
    }
    case 'set-rest': S.settings.rest = +b.dataset.v; saveSettings(); render(); break;
    case 'backup': backupData(); break;
    case 'restore-apply': applyRestore(); break;
    case 'restore-cancel': S.restore = null; render(); break;
    case 'toggle-sound': S.settings.sound = !S.settings.sound; saveSettings(); render(); if(S.settings.sound){ unlockAudio(); beep(); } break;
  }
});

    if(clean !== t.value) t.value = clean;

    if(s.done){
      recalcRecs(i); updStats();
      card.querySelectorAll('.set[data-j]').forEach(r => { const sj = ex.sets[+r.dataset.j]; r.classList.toggle('is-pr', !!sj.rec); r.querySelector('.set-n').textContent = sj.rec ? '★' : (+r.dataset.j + 1); });

  else if(['cf-kcal','cf-p','cf-f','cf-c','ca-min','ca-kcal','cp-w','cal-spent'].includes(t.id)){
    const c = t.value.replace(/[^\d.,]/g, '').slice(0, 6); if(c !== t.value) t.value = c;

  }

  else if(t.id === 't-target'){ S.tools.target = num(t.value); $('#plate-out').innerHTML = platesBlock(S.tools.target); }
  else if(t.id === 'w1' || t.id === 'r1'){

    else S.tools.w1 = num(t.value);
    $('#rm-out').innerHTML = rmBlock();
  }
});
